name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macOS-latest]
        framework: [net10.0, net11.0]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Test
      run: dotnet run -c Release --project Tests --framework ${{ matrix.framework }} --output Detailed --disable-logo --no-progress